<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="weather-bg" id="backgroundLayer"></div>
    <main class="card app" id="appCard">
        <header class="app__header">
            <div>
                <p class="eyebrow">Your daily forecast</p>
                <h1 class="app__title">Weather Now</h1>
            </div>
            <button class="unit-toggle" id="unitToggle" aria-label="Toggle temperature unit">°C</button>
        </header>

        <form class="search" id="searchForm" novalidate>
            <label class="sr-only" for="cityInput">City name</label>
            <input id="cityInput" type="text" placeholder="Enter city name" spellcheck="false" autocomplete="off">
            <button type="submit" aria-label="Search city">
                <img src="images/search.png" alt="">
            </button>
        </form>
        <p class="helper">Press Enter to search or use the toggle to switch units.</p>

        <div class="status">
            <div class="loading" id="loading" aria-live="polite">Loading...</div>
            <div class="error" id="error" role="alert"></div>
        </div>

        <section class="weather" id="weather" aria-live="polite">
            <div class="current">
                <img src="images/clear.png" class="weather-icon" id="weatherIcon" alt="Weather icon">
                <div>
                    <p class="temp" id="temp">--°C</p>
                    <p class="city" id="city">Search for a city</p>
                    <p class="condition" id="condition">--</p>
                </div>
            </div>
            <div class="details">
                <div class="detail">
                    <img src="images/humidity.png" alt="">
                    <div>
                        <p class="label">Humidity</p>
                        <p class="value" id="humidity">--%</p>
                    </div>
                </div>
                <div class="detail">
                    <img src="images/wind.png" alt="">
                    <div>
                        <p class="label">Wind</p>
                        <p class="value" id="wind">-- km/h</p>
                    </div>
                </div>
                <div class="detail">
                    <img src="images/drizzle.png" alt="">
                    <div>
                        <p class="label">Feels like</p>
                        <p class="value" id="feelsLike">--°C</p>
                    </div>
                </div>
            </div>
        </section>
    </main>

<script>
    // Global state
    let isCelsius = true;

    // API configuration
    const apiKey = "50c4c5310beba49e8b8044d5abb4da4e";
    const apiBase = "https://api.openweathermap.org/data/2.5/weather";

    // DOM references
    const appCard = document.getElementById("appCard");
    const backgroundLayer = document.getElementById("backgroundLayer");
    const cityInput = document.getElementById("cityInput");
    const searchForm = document.getElementById("searchForm");
    const unitToggle = document.getElementById("unitToggle");
    const loadingEl = document.getElementById("loading");
    const errorEl = document.getElementById("error");
    const weatherSection = document.getElementById("weather");
    const weatherIcon = document.getElementById("weatherIcon");
    const tempEl = document.getElementById("temp");
    const cityEl = document.getElementById("city");
    const conditionEl = document.getElementById("condition");
    const humidityEl = document.getElementById("humidity");
    const windEl = document.getElementById("wind");
    const feelsLikeEl = document.getElementById("feelsLike");

    // Icon lookup map
    const iconMap = {
        Clear: "images/clear.png",
        Clouds: "images/clouds.png",
        Rain: "images/rain.png",
        Drizzle: "images/drizzle.png",
        Mist: "images/mist.png",
        Haze: "images/mist.png",
        Fog: "images/mist.png",
        Snow: "images/snow.png",
        Thunderstorm: "images/rain.png"
    };

    const backgroundMap = {
        Clear: "clear",
        Clouds: "cloudy",
        Rain: "rainy",
        Drizzle: "rainy",
        Mist: "misty",
        Haze: "misty",
        Fog: "misty",
        Snow: "snowy",
        Thunderstorm: "stormy"
    };

    const savePreferences = (city) => {
        if (city) {
            localStorage.setItem("lastCity", city);
        }
        localStorage.setItem("unitPref", isCelsius ? "c" : "f");
    };

    const loadPreferences = () => {
        const savedUnit = localStorage.getItem("unitPref");
        const savedCity = localStorage.getItem("lastCity");
        if (savedUnit === "f") {
            isCelsius = false;
        }
        updateUnitToggle();
        return savedCity;
    };

    const setLoading = (state) => {
        loadingEl.style.display = state ? "block" : "none";
    };

    const setError = (message) => {
        errorEl.textContent = message || "";
        errorEl.style.display = message ? "block" : "none";
        if (message) {
            weatherSection.classList.add("weather--hidden");
        }
    };

    const applyBackground = (condition) => {
        const backgroundClass = backgroundMap[condition] || "default";
        appCard.className = `card app ${backgroundClass}`;
        backgroundLayer.className = `weather-bg ${backgroundClass}`;
    };

    const displayWeather = (data) => {
        const { name, main, weather, wind } = data;
        const condition = weather?.[0]?.main || "Clear";
        const unitSymbol = isCelsius ? "°C" : "°F";
        const windUnit = isCelsius ? "km/h" : "mph";

        cityEl.textContent = name;
        conditionEl.textContent = weather?.[0]?.description || condition;
        tempEl.textContent = `${Math.round(main.temp)}${unitSymbol}`;
        feelsLikeEl.textContent = `${Math.round(main.feels_like)}${unitSymbol}`;
        humidityEl.textContent = `${main.humidity}%`;
        windEl.textContent = `${Math.round(wind.speed)} ${windUnit}`;

        const iconSrc = iconMap[condition] || iconMap.Clear;
        weatherIcon.src = iconSrc;
        weatherIcon.alt = condition;

        applyBackground(condition);

        weatherSection.classList.remove("weather--hidden");
        setError("");
    };

    const buildUrl = ({ city, lat, lon }) => {
        const units = isCelsius ? "metric" : "imperial";
        const params = new URLSearchParams({
            units,
            appid: apiKey
        });
        if (city) {
            params.append("q", city);
        } else if (lat && lon) {
            params.append("lat", lat);
            params.append("lon", lon);
        }
        return `${apiBase}?${params.toString()}`;
    };

    const checkWeather = async ({ city, lat, lon } = {}) => {
        const hasCity = city && city.trim();
        if (!hasCity && !(lat && lon)) {
            setError("Please enter a city to search.");
            return;
        }

        setLoading(true);
        setError("");

        try {
            const url = buildUrl({ city: hasCity ? city.trim() : undefined, lat, lon });
            const response = await fetch(url);
            if (!response.ok) {
                throw new Error(`Request failed: ${response.status}`);
            }
            const data = await response.json();
            displayWeather(data);
            savePreferences(data.name);
        } catch (err) {
            console.error(err);
            setError("Unable to fetch weather right now. Please try again.");
        } finally {
            setLoading(false);
        }
    };

    const updateUnitToggle = () => {
        unitToggle.textContent = isCelsius ? "°C" : "°F";
    };

    const handleSearch = (event) => {
        event.preventDefault();
        const city = cityInput.value.trim();
        checkWeather({ city });
    };

    const handleUnitToggle = () => {
        isCelsius = !isCelsius;
        updateUnitToggle();
        savePreferences();
        const currentCity = cityEl.textContent;
        if (currentCity && currentCity !== "Search for a city") {
            checkWeather({ city: currentCity });
        }
    };

    const requestGeolocation = () => {
        if (!navigator.geolocation) {
            return;
        }
        navigator.geolocation.getCurrentPosition(
            (pos) => {
                const { latitude, longitude } = pos.coords;
                checkWeather({ lat: latitude, lon: longitude });
            },
            () => {
                const savedCity = loadPreferences();
                if (savedCity) {
                    checkWeather({ city: savedCity });
                }
            },
            { enableHighAccuracy: false, timeout: 8000 }
        );
    };

    document.addEventListener("DOMContentLoaded", () => {
        const savedCity = loadPreferences();
        if (savedCity) {
            checkWeather({ city: savedCity });
        }
        requestGeolocation();
    });

    searchForm.addEventListener("submit", handleSearch);
    cityInput.addEventListener("keypress", (e) => {
        if (e.key === "Enter") {
            handleSearch(e);
        }
    });
    unitToggle.addEventListener("click", handleUnitToggle);
</script>

</body>
</html>
